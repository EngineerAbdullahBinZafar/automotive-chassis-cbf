name: CI — Automotive Chassis MPC + HOCBF

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Pytest Full Suite (88 Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy osqp cvxpy pytest flake8

      - name: Syntax check with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute 88-test verification suite
        run: python -m pytest tests/ -v --tb=short
