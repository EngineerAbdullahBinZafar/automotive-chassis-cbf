<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.8px; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #00d4ff; font-weight: 700; }
      .bh { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #cbd5e1; }
      .ok { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #10b981; font-weight: 700; }
      .warn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="446" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="956" height="4" rx="2" fill="url(#hdrGrad)"/>

  <text x="26" y="34" class="h1">ACTIVE CHASSIS HIL ARCHITECTURE — 100 Hz CONDENSED MPC + RELATIVE-DEGREE r=2 HOCBF</text>
  <text x="26" y="54" class="sub">ISO 8608 CLASS A-E STOCHASTIC ROAD SYNTHESIS | +/-50 mm STROKE INVARIANT | AUTOSAR E2E CAN (chassis_dynamics.dbc)</text>

  <!-- Sensor & Road Input Stage -->
  <rect x="26" y="80" width="210" height="220" rx="8" fill="#0f172a" stroke="#00d4ff" stroke-width="1.4"/>
  <rect x="26" y="80" width="210" height="26" rx="8" fill="#0369a1" fill-opacity="0.45"/>
  <text x="38" y="98" class="bh">Plant &amp; Road Sensors</text>
  <text x="38" y="124" class="m">• Quarter-Car m_s=500kg</text>
  <text x="38" y="144" class="m">• Unsprung Hub m_u=50kg</text>
  <text x="38" y="164" class="m">• 0.12s Road Preview Lidar</text>
  <text x="38" y="186" class="warn">Sensors (1 kHz Anti-Alias)</text>
  <text x="38" y="206" class="m">• LVDT Stroke (z_s - z_u)</text>
  <text x="38" y="226" class="m">• Sprung IMU (ddz_s)</text>
  <text x="38" y="248" class="m">• Wheel Hub Accelerometer</text>
  <text x="38" y="284" class="ok">RK4 Plant (dt = 1 ms)</text>

  <!-- Arrow Plant -> MPC & HOCBF -->
  <line x1="236" y1="150" x2="274" y2="150" stroke="#00d4ff" stroke-width="2"/>
  <polygon points="274,145 284,150 274,155" fill="#00d4ff"/>

  <!-- Level 1: Condensed Linear MPC -->
  <rect x="286" y="80" width="210" height="115" rx="8" fill="#0f172a" stroke="#7b61ff" stroke-width="1.4"/>
  <rect x="286" y="80" width="210" height="26" rx="8" fill="#4c1d95" fill-opacity="0.45"/>
  <text x="298" y="98" class="bh">Level 1: 100 Hz MPC</text>
  <text x="298" y="124" class="m">• Horizon Np=12 (Ts=10ms)</text>
  <text x="298" y="144" class="m">• DARE Terminal Cost P_inf</text>
  <text x="298" y="164" class="m">• ISO 2631-1 RMS Comfort</text>
  <text x="298" y="184" class="ok">+35.65% Ride Comfort Gain</text>

  <!-- Arrow MPC -> HOCBF -->
  <line x1="391" y1="195" x2="391" y2="215" stroke="#7b61ff" stroke-width="2"/>
  <polygon points="386,215 391,223 396,215" fill="#7b61ff"/>

  <!-- Level 2: HOCBF r=2 Shield -->
  <rect x="286" y="225" width="210" height="115" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.6"/>
  <rect x="286" y="225" width="210" height="26" rx="8" fill="#065f46" fill-opacity="0.5"/>
  <text x="298" y="243" class="bh">Level 2: HOCBF (r=2)</text>
  <text x="298" y="269" class="m">• psi_2(x,u) &gt;= 0 Shield</text>
  <text x="298" y="289" class="ok">• Stroke Invariant: +/-50mm</text>
  <text x="298" y="309" class="ok">• Tire Ground Force Fz&gt;=0</text>
  <text x="298" y="329" class="sub">Median Loop: 269.7 us</text>

  <!-- Arrow HOCBF -> Actuator -->
  <line x1="496" y1="282" x2="536" y2="282" stroke="#10b981" stroke-width="2"/>
  <polygon points="536,277 546,282 536,287" fill="#10b981"/>

  <!-- Level 3: Hydraulic/Electromagnetic Actuator -->
  <rect x="548" y="80" width="185" height="220" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
  <rect x="548" y="80" width="185" height="26" rx="8" fill="#78350f" fill-opacity="0.5"/>
  <text x="560" y="98" class="bh">Level 3: Strut Drive</text>
  <text x="560" y="124" class="m">• Saturation: +/-2500 N</text>
  <text x="560" y="144" class="m">• Slew Rate: 15 kN/s</text>
  <text x="560" y="164" class="m">• 1st-Order Thermal Model</text>
  <text x="560" y="186" class="warn">Power Stage Protection:</text>
  <text x="560" y="206" class="m">• Coil Temp Derating Gate</text>
  <text x="560" y="226" class="m">• 48V Bus Current Clamp</text>
  <text x="560" y="248" class="m">• &lt;3% CPU Load @ 100Hz</text>
  <text x="560" y="284" class="ok">Safe Force u* -&gt; Plant</text>

  <!-- Feedback Arrow Strut -> Plant -->
  <path d="M 640 300 L 640 356 L 131 356 L 131 306" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5,4"/>
  <polygon points="126,306 131,298 136,306" fill="#f59e0b"/>
  <text x="275" y="348" class="warn">Physical Actuator Force F_a Applied to Quarter/Half-Car Dynamics</text>

  <!-- Level 4: AUTOSAR E2E CAN Bus -->
  <rect x="756" y="80" width="178" height="220" rx="8" fill="#0f172a" stroke="#00d4ff" stroke-width="1.4"/>
  <rect x="756" y="80" width="178" height="26" rx="8" fill="#0369a1" fill-opacity="0.45"/>
  <text x="768" y="98" class="bh">Level 4: CAN Telemetry</text>
  <text x="768" y="124" class="sub">chassis_dynamics.dbc</text>
  <text x="768" y="148" class="m">• 0x110 Actuator Demand</text>
  <text x="768" y="168" class="m">• 0x120 Heave (100 Hz)</text>
  <text x="768" y="188" class="m">• 0x121 Pitch (100 Hz)</text>
  <text x="768" y="216" class="ok">AUTOSAR E2E Profile 1</text>
  <text x="768" y="236" class="m">• SAE J1850 CRC-8 (0x1D)</text>
  <text x="768" y="256" class="m">• 4-bit Alive Counter</text>
  <text x="768" y="284" class="ok">88 / 88 Tests Verified</text>

  <line x1="733" y1="190" x2="756" y2="190" stroke="#00d4ff" stroke-width="2"/>

  <!-- Footer Summary -->
  <rect x="26" y="376" width="908" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="42" y="398" class="sub">VERIFIED HIL ENVELOPE: +35.65% ISO 2631-1 Ride Comfort | Zero Constraint Violations Over 35 mm Bump &amp; Pothole Tests</text>
  <text x="42" y="416" class="m">Maurice Olley Flat-Ride Modal Ratio (f_pitch / f_bounce = 1.05..1.20) | Continuous GitHub Actions Regression Guarded</text>
</svg>